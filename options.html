<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manga Translator Settings</title>
  <link rel="stylesheet" href="src/shared/theme.css">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 620px; margin: 20px auto; padding: 20px; background: var(--manga-bg); color: var(--manga-text); border-radius: 8px; }
    h2, h3 { color: var(--manga-accent); margin-top: 0; } h3 { margin-top: 24px; border-bottom: 1px solid var(--manga-border); padding-bottom: 6px; font-size: 16px; }
    label { font-size: 13px; color: var(--manga-text-muted); display: block; margin-top: 12px; }
    input[type="text"], input[type="password"], input[type="number"], select { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; background: var(--manga-surface); border: 1px solid var(--manga-border); color: var(--manga-text); border-radius: var(--manga-radius); font-size: 14px; }
    .row { display: flex; gap: 12px; align-items: center; } .row > div { flex: 1; }
    input[type="color"] { width: 100%; height: 36px; padding: 2px; background: var(--manga-surface); border: 1px solid var(--manga-border); border-radius: var(--manga-radius); cursor: pointer; }
    button { margin-top: 10px; padding: 8px 12px; background: var(--manga-primary); border: 0; border-radius: var(--manga-radius); color: var(--manga-text); cursor: pointer; } button.secondary { background: var(--manga-surface-raised); } button:disabled { opacity: .6; cursor: wait; }
    .check { display: flex; gap: 8px; align-items: center; color: var(--manga-text-label); } .check input { margin: 0; }
    .notice { padding: 12px; background: var(--manga-surface); border-left: 3px solid var(--manga-accent); font-size: 13px; line-height: 1.5; }
    .status { margin-top: 15px; font-size: 13px; color: var(--manga-success-text); min-height: 18px; }
  </style>
</head>
<body>
  <h2>Manga Translator Settings</h2>
  <div id="onboarding" class="notice">Choose a provider, enter its credentials, then test the connection to complete setup.</div>
  <h3>Provider</h3>
  <label for="provider">Provider:</label><select id="provider"><option value="openai">OpenAI</option><option value="gemini">Gemini (OpenAI-compatible)</option><option value="anthropic">Anthropic</option><option value="ollama">Ollama (local)</option><option value="lmstudio">LM Studio (local)</option><option value="custom">Custom OpenAI-compatible</option></select>
  <label for="endpoint">API Endpoint URL:</label><input type="text" id="endpoint" placeholder="https://api.provider.com/v1/chat/completions">
  <label for="apiKey">API Key / Token:</label><input type="password" id="apiKey" placeholder="Leave empty for local providers" autocomplete="off">
  <button type="button" id="toggleKey" class="secondary">Show key</button> <button type="button" id="clearKey" class="secondary">Clear key</button>
  <label class="check"><input type="checkbox" id="apiKeySessionOnly"> Keep key only until Chrome closes</label>
  <div class="notice">By default, the API key is stored in Chrome extension storage on this device. Session-only storage removes it when Chrome closes.</div>
  <label for="model">Model Name:</label><input type="text" id="model">
  <div class="row"><div><label for="sourceLanguage">Source Language:</label><select id="sourceLanguage"><option>Automatic</option><option>Japanese</option><option>Korean</option><option>Chinese</option></select></div><div><label for="targetLanguage">Target Language:</label><select id="targetLanguage"><option>English</option><option>Spanish</option><option>French</option><option>German</option><option>Indonesian</option><option>Portuguese</option></select></div></div>
  <label class="check"><input type="checkbox" id="separateStages" checked> Separate OCR and translation for cheaper retries</label>
  <label class="check"><input type="checkbox" id="persistOverlays" checked> Restore translations when revisiting a page</label>
  <button type="button" id="testConnection">Test Connection</button>
  <h3>Usage</h3><div id="usageSummary" class="notice">No requests recorded yet.</div>
  <div class="row"><div><label for="customInputRate">Custom input USD / 1M tokens:</label><input type="number" id="customInputRate" min="0" step="0.01" value="0"></div><div><label for="customOutputRate">Custom output USD / 1M tokens:</label><input type="number" id="customOutputRate" min="0" step="0.01" value="0"></div></div>
  <h3>Appearance</h3>
  <label for="fontSizeMode">Font Size Mode:</label><select id="fontSizeMode"><option value="auto">Automatic / Adaptive</option><option value="manual">Fixed Manual Size</option></select>
  <div id="manualFontContainer" style="display:none"><label for="manualFontSize">Font Size (px):</label><input type="number" id="manualFontSize" value="14" min="8" max="36"></div>
  <label for="fontFamily">Translation Font:</label><select id="fontFamily"><option value="system">System Sans</option><option value="comic">Comic</option><option value="rounded">Rounded</option><option value="serif">Book Serif</option><option value="condensed">Condensed</option><option value="typewriter">Typewriter</option><option value="classic">Classic Sans</option></select>
  <div class="row"><div><label for="bubbleBgColor">Bubble Background:</label><input type="color" id="bubbleBgColor" value="#ffffff"></div><div><label for="textColor">Text Color:</label><input type="color" id="textColor" value="#000000"></div></div>
  <div class="status" id="status" role="status" aria-live="polite"></div><script type="module" src="options.js"></script>
</body>
</html>
